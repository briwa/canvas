<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }

      canvas {
        border: 1px solid currentColor;
        border-radius: 4px;
        max-width: 100%;
      }

      dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.25rem 1rem;
        margin: 0;
      }

      dt {
        opacity: 0.6;
      }

      dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="480" height="240"></canvas>

    <div>
      <button id="restart" type="button">restart</button>
    </div>

    <dl>
      <dt>timeline.index</dt>
      <dd id="index">-1</dd>
      <dt>timeline.step</dt>
      <dd id="step">null</dd>
      <dt>timeline.done</dt>
      <dd id="done">false</dd>
      <dt>step.progress</dt>
      <dd id="progress">0</dd>
      <dt>target.alpha</dt>
      <dd id="alpha">0</dd>
    </dl>

    <script type="module">
      import { Bar, Renderer, Step, Timeline, linear } from './src/index.js';

      // Same step as test/timeline.test.js, slowed down so it's visible.
      class Fade extends Step {
        enter() {
          this.tween(this.entities[0], {
            startAt: 0,
            duration: this.duration,
            from: { alpha: 0 },
            to: { alpha: 1 },
            ease: linear,
          });
        }
      }

      const target = new Bar({
        x0: 40,
        y0: 40,
        x1: 440,
        y1: 200,
        color: '#3b82f6',
        alpha: 0,
      });

      const canvas = document.getElementById('stage');
      const renderer = new Renderer(canvas, [target]);

      const readout = {
        index: document.getElementById('index'),
        step: document.getElementById('step'),
        done: document.getElementById('done'),
        progress: document.getElementById('progress'),
        alpha: document.getElementById('alpha'),
      };

      let timeline = build();

      function build() {
        return new Timeline([target], [new Fade({ duration: 800 }), new Fade({ duration: 800 })]);
      }

      function frame(time) {
        const step = timeline.update(time);

        readout.index.textContent = String(timeline.index);
        readout.step.textContent = timeline.step ? `Fade #${timeline.index}` : 'null';
        readout.done.textContent = String(timeline.done);
        readout.progress.textContent = step ? step.progress.toFixed(2) : '—';
        readout.alpha.textContent = target.alpha.toFixed(2);

        renderer.update();
        requestAnimationFrame(frame);
      }

      document.getElementById('restart').addEventListener('click', () => {
        target.alpha = 0;
        timeline = build();
      });

      requestAnimationFrame(frame);
    </script>
  </body>
</html>

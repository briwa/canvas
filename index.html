<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline demo &amp; benchmark</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }

      canvas {
        border: 1px solid currentColor;
        border-radius: 4px;
        max-width: 100%;
      }

      .controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      .panels {
        display: flex;
        gap: 2.5rem;
        flex-wrap: wrap;
      }

      dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.25rem 1rem;
        margin: 0;
        align-content: start;
      }

      dt {
        opacity: 0.6;
      }

      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.5;
        margin: 0 0 0.5rem;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="960" height="480"></canvas>

    <div class="controls">
      <button id="restart" type="button">restart</button>
      <label for="count">cards</label>
      <select id="count">
        <option value="60" selected>60</option>
        <option value="600">600</option>
        <option value="2000">2000</option>
        <option value="6000">6000</option>
        <option value="20000">20000</option>
      </select>
      <label><input id="loop" type="checkbox" checked /> loop</label>
      <button id="reset-stats" type="button">reset stats</button>
    </div>

    <div class="panels">
      <div>
        <h2>Timeline</h2>
        <dl>
          <dt>timeline.index</dt>
          <dd id="index">-1</dd>
          <dt>timeline.step</dt>
          <dd id="step">null</dd>
          <dt>timeline.done</dt>
          <dd id="done">false</dd>
          <dt>step.progress</dt>
          <dd id="progress">0</dd>
        </dl>
      </div>

      <div>
        <h2>Benchmark</h2>
        <dl>
          <dt>fps</dt>
          <dd id="fps">—</dd>
          <dt>frame (avg / p95 / max)</dt>
          <dd id="frame">—</dd>
          <dt>update (avg / p95 / max)</dt>
          <dd id="update">—</dd>
          <dt>render (avg / p95 / max)</dt>
          <dd id="render">—</dd>
          <dt>tweens</dt>
          <dd id="tweens">—</dd>
          <dt>settled (skipped)</dt>
          <dd id="settled">—</dd>
          <dt>frames sampled</dt>
          <dd id="frames">0</dd>
        </dl>
      </div>
    </div>

    <script type="module">
      import { Rect, Renderer, Step, Timeline, linear } from './src/index.js';

      const canvas = document.getElementById('stage');

      const STAGGER = 600;
      const TWEEN = 900;
      const BASE = { r: 30, g: 41, b: 59 };
      const ACCENT = { r: 244, g: 63, b: 94 };

      class Enter extends Step {
        enter() {
          const stagger = STAGGER / Math.max(this.entities.length - 1, 1);

          this.entities.forEach((entity, i) => {
            this.tween(entity, {
              startAt: i * stagger,
              duration: TWEEN,
              ease: linear,
              from: { alpha: 0, y0: entity.y0 + 24, color: BASE },
              to: { alpha: 1, y0: entity.y0, color: entity.tint },
            });
          });
        }
      }

      class Shift extends Step {
        enter() {
          const stagger = STAGGER / Math.max(this.entities.length - 1, 1);

          this.entities.forEach((entity, i) => {
            this.tween(entity, {
              startAt: i * stagger,
              duration: TWEEN,
              ease: linear,
              from: { color: entity.tint, alpha: 1 },
              to: { color: ACCENT, alpha: 0.25 },
            });
          });
        }
      }

      function tint(h, s, l) {
        const f = (n) => {
          const k = (n + h / 30) % 12;
          const v = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
          return Math.round(v * 255);
        };

        return { r: f(0), g: f(8), b: f(4) };
      }

      function makeCards(count) {
        const aspect = canvas.width / canvas.height;
        const cols = Math.max(1, Math.round(Math.sqrt(count * aspect)));
        const rows = Math.ceil(count / cols);
        const cw = canvas.width / cols;
        const ch = canvas.height / rows;
        const pad = Math.min(cw, ch) * 0.12;
        const cards = [];

        for (let i = 0; i < count; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const card = new Rect({
            x0: col * cw + pad,
            y0: row * ch + pad,
            x1: (col + 1) * cw - pad,
            y1: (row + 1) * ch - pad,
            alpha: 0,
          });

          card.tint = tint((i / count) * 320, 0.7, 0.55);
          cards.push(card);
        }

        return cards;
      }

      const readout = {};
      for (const id of [
        'index',
        'step',
        'done',
        'progress',
        'fps',
        'frame',
        'update',
        'render',
        'tweens',
        'settled',
        'frames',
      ]) {
        readout[id] = document.getElementById(id);
      }

      const countInput = document.getElementById('count');
      const loopInput = document.getElementById('loop');

      let cards = [];
      let renderer = null;
      let timeline = null;

      const samples = { frame: [], update: [], render: [] };
      const LIMIT = 240;
      let frames = 0;
      let fpsFrames = 0;
      let fpsSince = 0;
      let fps = 0;
      let last = 0;

      function resetStats() {
        samples.frame.length = 0;
        samples.update.length = 0;
        samples.render.length = 0;
        frames = 0;
        fpsFrames = 0;
        fpsSince = 0;
        fps = 0;
        last = 0;
      }

      function rebuild() {
        cards = makeCards(Number(countInput.value));
        renderer = new Renderer(canvas, cards);
        timeline = new Timeline(cards, [
          new Enter({ duration: STAGGER + TWEEN }),
          new Shift({ duration: STAGGER + TWEEN }),
        ]);

        resetStats();
      }

      function push(key, value) {
        const list = samples[key];
        list.push(value);
        if (list.length > LIMIT) list.shift();
      }

      function stats(key) {
        const list = samples[key];
        if (!list.length) return '—';

        let total = 0;
        let max = 0;
        for (const v of list) {
          total += v;
          if (v > max) max = v;
        }

        const sorted = [...list].sort((a, b) => a - b);
        const p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))];

        return `${(total / list.length).toFixed(2)} / ${p95.toFixed(2)} / ${max.toFixed(2)} ms`;
      }

      function tweenCounts() {
        const tweens = timeline.step?.tweener.tweens;
        if (!tweens) return { total: 0, settled: 0 };

        let settled = 0;
        for (const tween of tweens) if (tween.settled) settled++;

        return { total: tweens.length, settled };
      }

      let painted = 0;

      function paint(step) {
        const { total, settled } = tweenCounts();
        const share = total ? ((settled / total) * 100).toFixed(0) : '0';

        readout.index.textContent = String(timeline.index);
        readout.step.textContent = timeline.step ? timeline.step.constructor.name : 'null';
        readout.done.textContent = String(timeline.done);
        readout.progress.textContent = step ? step.progress.toFixed(2) : '—';

        readout.fps.textContent = fps ? fps.toFixed(1) : '—';
        readout.frame.textContent = stats('frame');
        readout.update.textContent = stats('update');
        readout.render.textContent = stats('render');
        readout.tweens.textContent = String(total);
        readout.settled.textContent = `${settled} (${share}%)`;
        readout.frames.textContent = String(frames);
      }

      function frame(time) {
        const t0 = performance.now();
        const step = timeline.update(time);
        const t1 = performance.now();
        renderer.update();
        const t2 = performance.now();

        if (last) push('frame', time - last);
        last = time;

        push('update', t1 - t0);
        push('render', t2 - t1);
        frames++;

        fpsFrames++;
        if (!fpsSince) fpsSince = time;
        else if (time - fpsSince >= 500) {
          fps = (fpsFrames * 1000) / (time - fpsSince);
          fpsFrames = 0;
          fpsSince = time;
        }

        if (time - painted >= 100) {
          painted = time;
          paint(step);
        }

        if (timeline.done && loopInput.checked) {
          for (const card of cards) card.alpha = 0;
          timeline.reset();
        }

        requestAnimationFrame(frame);
      }

      document.getElementById('restart').addEventListener('click', rebuild);
      document.getElementById('reset-stats').addEventListener('click', resetStats);
      countInput.addEventListener('change', rebuild);

      rebuild();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>

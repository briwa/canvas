<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>perf &mdash; canvas demos</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <nav>
      <a href="../index.html">canvas</a>
      <a href="./scene.html">scene</a>
      <a href="./perf.html" aria-current="page">perf</a>
    </nav>

    <canvas id="stage" width="960" height="480"></canvas>

    <div class="controls">
      <button id="restart" type="button">restart</button>
      <label for="count">cards</label>
      <select id="count">
        <option value="60" selected>60</option>
        <option value="600">600</option>
        <option value="2000">2000</option>
        <option value="6000">6000</option>
        <option value="20000">20000</option>
      </select>
      <label><input id="loop" type="checkbox" checked /> loop</label>
      <button id="reset-stats" type="button">reset stats</button>
    </div>

    <div class="panels">
      <div>
        <h2>Sequence</h2>
        <dl>
          <dt>root.index</dt>
          <dd id="index">-1</dd>
          <dt>root.step</dt>
          <dd id="step">null</dd>
          <dt>root.done</dt>
          <dd id="done">false</dd>
          <dt>step.progress</dt>
          <dd id="progress">0</dd>
        </dl>
      </div>

      <div>
        <h2>Benchmark</h2>
        <dl>
          <dt>fps</dt>
          <dd id="fps">—</dd>
          <dt>frame (avg / p95 / max)</dt>
          <dd id="frame">—</dd>
          <dt>update (avg / p95 / max)</dt>
          <dd id="update">—</dd>
          <dt>render (avg / p95 / max)</dt>
          <dd id="render">—</dd>
          <dt>tweens</dt>
          <dd id="tweens">—</dd>
          <dt>settled (skipped)</dt>
          <dd id="settled">—</dd>
          <dt>frames sampled</dt>
          <dd id="frames">0</dd>
        </dl>
      </div>
    </div>

    <script type="module" src="./perf.js"></script>
  </body>
</html>
